<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便利貼看板 Sticky Notes Board</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Noto Sans TC & Caveat for cursive sticky note accents -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            overflow-x: hidden;
        }

        /* Board Pattern Backgrounds */
        .bg-corkboard {
            background-color: #f3eae1;
            background-image: radial-gradient(#d6c2ad 1.5px, transparent 1.5px), radial-gradient(#d6c2ad 1.5px, #f3eae1 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }
        
        .bg-gridpaper {
            background-color: #f8fafc;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .bg-darkstudio {
            background-color: #0f172a;
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }

        /* Sticky Note Shadows & Paper Effect */
        .sticky-note {
            box-shadow: 3px 5px 15px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
            transition: box-shadow 0.2s ease, transform 0.15s ease;
        }
        .sticky-note:hover {
            box-shadow: 8px 12px 25px rgba(0,0,0,0.15), 0 3px 6px rgba(0,0,0,0.08);
        }
        .sticky-note.dragging {
            box-shadow: 15px 20px 30px rgba(0,0,0,0.22);
            cursor: grabbing !important;
            opacity: 0.95;
            transform: scale(1.03) !important;
        }

        /* Pin Graphic Element */
        .push-pin {
            filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.3));
        }

        /* Handdrawn accent font */
        .font-cursive {
            font-family: 'Caveat', cursive;
        }
    </style>
</head>
<body class="bg-corkboard min-h-screen text-slate-800 flex flex-col transition-colors duration-300" id="appBody">

    <!-- Top Header Bar -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40 px-4 py-3 shadow-sm flex flex-wrap items-center justify-between gap-3">
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-400 text-amber-950 flex items-center justify-center font-bold text-xl shadow-md transform -rotate-3">
                <i class="fa-solid fa-note-sticky"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-900 text-lg leading-tight flex items-center gap-2">
                    便利貼看板 <span class="text-xs px-2 py-0.5 bg-amber-100 text-amber-800 rounded-full font-medium">LocalStorage</span>
                </h1>
                <p class="text-xs text-slate-500">靈感、待辦事項與隨手筆記的視覺化空間</p>
            </div>
        </div>

        <!-- Search & Quick Actions -->
        <div class="flex items-center gap-2 flex-1 max-w-md mx-2">
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="搜尋標題、內容或標籤..." 
                       class="w-full pl-9 pr-8 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white transition-all">
                <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Tool Toolbar Controls -->
        <div class="flex items-center gap-2">
            <!-- Add Note Button -->
            <button id="addNoteBtn" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-medium px-3.5 py-1.5 rounded-lg text-sm shadow-sm flex items-center gap-1.5 transition-all">
                <i class="fa-solid fa-plus"></i>
                <span>新增便利貼</span>
            </button>

            <div class="h-6 w-px bg-slate-200 mx-1"></div>

            <!-- View Switcher -->
            <div class="bg-slate-100 p-1 rounded-lg border border-slate-200 flex text-xs">
                <button id="canvasViewBtn" class="px-2.5 py-1 rounded-md font-medium text-slate-700 bg-white shadow-sm transition-all" title="自由畫布模式 (可拖曳位置)">
                    <i class="fa-solid fa-grip text-amber-600 mr-1"></i>畫布
                </button>
                <button id="gridViewBtn" class="px-2.5 py-1 rounded-md font-medium text-slate-500 hover:text-slate-700 transition-all" title="網格整齊排列">
                    <i class="fa-solid fa-border-all mr-1"></i>網格
                </button>
            </div>

            <!-- Board Theme Menu Toggle -->
            <div class="relative">
                <button id="themeMenuBtn" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm transition-colors" title="切換背景主題">
                    <i class="fa-solid fa-palette"></i>
                </button>
                <div id="themeDropdown" class="hidden absolute right-0 mt-2 w-40 bg-white rounded-xl shadow-xl border border-slate-100 py-1.5 z-50 text-xs">
                    <div class="px-3 py-1 font-semibold text-slate-400">看板主題</div>
                    <button data-theme="bg-corkboard" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 flex items-center gap-2 text-slate-700">
                        <span class="w-3 h-3 rounded-full bg-amber-200 border border-amber-300"></span> 經典軟木塞
                    </button>
                    <button data-theme="bg-gridpaper" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 flex items-center gap-2 text-slate-700">
                        <span class="w-3 h-3 rounded-full bg-slate-100 border border-slate-300"></span> 網格方格紙
                    </button>
                    <button data-theme="bg-darkstudio" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 flex items-center gap-2 text-slate-700">
                        <span class="w-3 h-3 rounded-full bg-slate-800 border border-slate-600"></span> 暗色工作室
                    </button>
                </div>
            </div>

            <!-- More Options Menu -->
            <div class="relative">
                <button id="moreMenuBtn" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm transition-colors" title="更多操作與備份">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
                <div id="moreDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 py-1.5 z-50 text-xs">
                    <button id="exportBtn" class="w-full text-left px-3 py-2 hover:bg-slate-50 flex items-center gap-2 text-slate-700">
                        <i class="fa-solid fa-download text-slate-400 w-4"></i> 匯出 JSON 備份
                    </button>
                    <button id="importBtn" class="w-full text-left px-3 py-2 hover:bg-slate-50 flex items-center gap-2 text-slate-700">
                        <i class="fa-solid fa-upload text-slate-400 w-4"></i> 匯入 JSON 檔案
                    </button>
                    <input type="file" id="importFileInput" accept=".json" class="hidden">
                    <div class="my-1 border-t border-slate-100"></div>
                    <button id="soundToggleBtn" class="w-full text-left px-3 py-2 hover:bg-slate-50 flex items-center justify-between text-slate-700">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-volume-high text-slate-400 w-4"></i> 操作音效</span>
                        <span id="soundStatus" class="text-emerald-600 font-semibold">開啟</span>
                    </button>
                    <div class="my-1 border-t border-slate-100"></div>
                    <button id="clearAllBtn" class="w-full text-left px-3 py-2 hover:bg-rose-50 text-rose-600 flex items-center gap-2">
                        <i class="fa-solid fa-trash-can w-4"></i> 清空所有便利貼
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Filter Sub-bar -->
    <div class="bg-white/60 backdrop-blur-sm border-b border-slate-200/50 px-4 py-2 flex flex-wrap items-center justify-between gap-2 text-xs">
        <!-- Color filter options -->
        <div class="flex items-center gap-1.5">
            <span class="text-slate-500 font-medium mr-1">色彩篩選:</span>
            <button data-color-filter="all" class="color-filter-btn px-2 py-0.5 rounded-full border border-slate-300 bg-white text-slate-700 font-medium shadow-xs ring-2 ring-slate-400">全部</button>
            <button data-color-filter="yellow" class="color-filter-btn w-5 h-5 rounded-full bg-yellow-200 border border-yellow-400 hover:scale-110 transition-transform" title="黃色"></button>
            <button data-color-filter="pink" class="color-filter-btn w-5 h-5 rounded-full bg-pink-200 border border-pink-400 hover:scale-110 transition-transform" title="粉色"></button>
            <button data-color-filter="green" class="color-filter-btn w-5 h-5 rounded-full bg-emerald-200 border border-emerald-400 hover:scale-110 transition-transform" title="綠色"></button>
            <button data-color-filter="blue" class="color-filter-btn w-5 h-5 rounded-full bg-sky-200 border border-sky-400 hover:scale-110 transition-transform" title="藍色"></button>
            <button data-color-filter="purple" class="color-filter-btn w-5 h-5 rounded-full bg-purple-200 border border-purple-400 hover:scale-110 transition-transform" title="紫色"></button>
            <button data-color-filter="dark" class="color-filter-btn w-5 h-5 rounded-full bg-slate-700 border border-slate-900 hover:scale-110 transition-transform" title="深色"></button>
        </div>

        <!-- Sort and Stats -->
        <div class="flex items-center gap-4 text-slate-500">
            <div class="flex items-center gap-1">
                <i class="fa-solid fa-arrow-down-short-wide text-slate-400"></i>
                <select id="sortSelect" class="bg-transparent border-none text-slate-600 focus:outline-none cursor-pointer font-medium">
                    <option value="updatedDesc">最後更新 (最新)</option>
                    <option value="createdDesc">建立時間 (最新)</option>
                    <option value="createdAsc">建立時間 (最早)</option>
                    <option value="titleAsc">標題 A-Z</option>
                </select>
            </div>
            <div class="text-slate-400">|</div>
            <div>便利貼計數：<span id="noteCount" class="font-bold text-amber-600">0</span> 張</div>
        </div>
    </div>

    <!-- Main Sticky Notes Container Area -->
    <main class="flex-1 relative p-4 md:p-6 overflow-auto min-h-[calc(100vh-100px)]" id="boardArea">
        <!-- Canvas View Container (Absolute Positioned Note Stage) -->
        <div id="canvasContainer" class="relative w-full h-full min-h-[700px]"></div>

        <!-- Grid View Container (Responsive Flex/Grid Layout) -->
        <div id="gridContainer" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5 pb-20"></div>

        <!-- Empty State Placeholder -->
        <div id="emptyState" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center p-6 pointer-events-none">
            <div class="w-20 h-20 rounded-full bg-amber-100/80 border border-amber-200 flex items-center justify-center text-amber-500 text-3xl mb-3 shadow-inner">
                <i class="fa-regular fa-note-sticky"></i>
            </div>
            <h2 class="text-lg font-bold text-slate-700 mb-1">還沒有任何便利貼</h2>
            <p class="text-xs text-slate-500 max-w-xs mb-4">點擊右上角的「新增便利貼」按鈕，開始記下靈感、任務或重點標籤吧！</p>
            <button id="emptyAddBtn" class="pointer-events-auto bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">
                <i class="fa-solid fa-plus mr-1"></i> 新增第一張便利貼
            </button>
        </div>
    </main>

    <!-- Note Add/Edit Modal -->
    <div id="noteModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-200 border border-slate-100" id="modalBox">
            <!-- Modal Header -->
            <div class="px-5 py-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-amber-500"></i> 新增便利貼
                </h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-200/50 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Form -->
            <form id="noteForm" class="p-5 space-y-4">
                <input type="hidden" id="editNoteId">

                <!-- Color Palette Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-2">便利貼顏色</label>
                    <div class="flex items-center gap-3" id="colorPickerGroup">
                        <label class="cursor-pointer">
                            <input type="radio" name="noteColor" value="yellow" checked class="peer sr-only">
                            <span class="w-8 h-8 rounded-full bg-amber-200 border-2 border-amber-300 block peer-checked:ring-2 peer-checked:ring-offset-2 peer-checked:ring-amber-500 hover:scale-105 transition-transform"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="noteColor" value="pink" class="peer sr-only">
                            <span class="w-8 h-8 rounded-full bg-pink-200 border-2 border-pink-300 block peer-checked:ring-2 peer-checked:ring-offset-2 peer-checked:ring-pink-500 hover:scale-105 transition-transform"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="noteColor" value="green" class="peer sr-only">
                            <span class="w-8 h-8 rounded-full bg-emerald-200 border-2 border-emerald-300 block peer-checked:ring-2 peer-checked:ring-offset-2 peer-checked:ring-emerald-500 hover:scale-105 transition-transform"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="noteColor" value="blue" class="peer sr-only">
                            <span class="w-8 h-8 rounded-full bg-sky-200 border-2 border-sky-300 block peer-checked:ring-2 peer-checked:ring-offset-2 peer-checked:ring-sky-500 hover:scale-105 transition-transform"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="noteColor" value="purple" class="peer sr-only">
                            <span class="w-8 h-8 rounded-full bg-purple-200 border-2 border-purple-300 block peer-checked:ring-2 peer-checked:ring-offset-2 peer-checked:ring-purple-500 hover:scale-105 transition-transform"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="noteColor" value="dark" class="peer sr-only">
                            <span class="w-8 h-8 rounded-full bg-slate-700 border-2 border-slate-800 block peer-checked:ring-2 peer-checked:ring-offset-2 peer-checked:ring-slate-600 hover:scale-105 transition-transform"></span>
                        </label>
                    </div>
                </div>

                <!-- Title Input -->
                <div>
                    <label for="noteTitleInput" class="block text-xs font-semibold text-slate-600 mb-1">標題</label>
                    <input type="text" id="noteTitleInput" placeholder="輸入便利貼標題..." required
                           class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>

                <!-- Content Input Area -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="noteContentInput" class="block text-xs font-semibold text-slate-600">筆記內容</label>
                        <span class="text-[10px] text-slate-400">支援清單格式：`- [ ] 項目`</span>
                    </div>
                    <textarea id="noteContentInput" rows="5" placeholder="寫下任何想法、清單或任務..." required
                              class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 font-sans"></textarea>
                </div>

                <!-- Tags Input -->
                <div>
                    <label for="noteTagsInput" class="block text-xs font-semibold text-slate-600 mb-1">分類標籤 (用逗號或空格分隔)</label>
                    <input type="text" id="noteTagsInput" placeholder="例如: 工作, 重要, 待辦" 
                           class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>

                <!-- Pin Option Checkbox -->
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="notePinnedInput" class="w-4 h-4 text-amber-500 rounded border-slate-300 focus:ring-amber-400">
                    <label for="notePinnedInput" class="text-xs text-slate-700 font-medium cursor-pointer select-none">
                        <i class="fa-solid fa-thumbtack text-amber-500 mr-1"></i> 釘選在畫布最上方
                    </label>
                </div>

                <!-- Modal Footer Buttons -->
                <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" id="cancelModalBtn" class="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100 text-xs font-medium">取消</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium shadow-sm">儲存便利貼</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Dialog / Confirmation Modal (No browser alert) -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5 border border-slate-100 text-center">
            <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center text-xl mx-auto mb-3">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="confirmTitle" class="font-bold text-slate-800 text-base mb-1">確定要執行此操作？</h3>
            <p id="confirmMessage" class="text-xs text-slate-500 mb-5">刪除後將無法恢復此內容。</p>
            <div class="flex items-center justify-center gap-3">
                <button id="confirmCancelBtn" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg">取消</button>
                <button id="confirmOkBtn" class="w-full py-2 bg-rose-500 hover:bg-rose-600 text-white text-xs font-semibold rounded-lg shadow-sm">確認刪除</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // Color Styles Configurations
        const COLOR_MAP = {
            yellow: {
                bg: 'bg-amber-100',
                header: 'bg-amber-200/80',
                border: 'border-amber-300',
                text: 'text-amber-950',
                accent: 'text-amber-700',
                tagBg: 'bg-amber-200/60 text-amber-800'
            },
            pink: {
                bg: 'bg-pink-100',
                header: 'bg-pink-200/80',
                border: 'border-pink-300',
                text: 'text-pink-950',
                accent: 'text-pink-700',
                tagBg: 'bg-pink-200/60 text-pink-800'
            },
            green: {
                bg: 'bg-emerald-100',
                header: 'bg-emerald-200/80',
                border: 'border-emerald-300',
                text: 'text-emerald-950',
                accent: 'text-emerald-700',
                tagBg: 'bg-emerald-200/60 text-emerald-800'
            },
            blue: {
                bg: 'bg-sky-100',
                header: 'bg-sky-200/80',
                border: 'border-sky-300',
                text: 'text-sky-950',
                accent: 'text-sky-700',
                tagBg: 'bg-sky-200/60 text-sky-800'
            },
            purple: {
                bg: 'bg-purple-100',
                header: 'bg-purple-200/80',
                border: 'border-purple-300',
                text: 'text-purple-950',
                accent: 'text-purple-700',
                tagBg: 'bg-purple-200/60 text-purple-800'
            },
            dark: {
                bg: 'bg-slate-800',
                header: 'bg-slate-700',
                border: 'border-slate-600',
                text: 'text-slate-100',
                accent: 'text-amber-400',
                tagBg: 'bg-slate-700 text-slate-300'
            }
        };

        // Default initial sticky notes for new visitors
        const INITIAL_NOTES = [
            {
                id: 'note_demo_1',
                title: '歡迎使用便利貼看板！📌',
                content: '這是一個基於靜態技術與 LocalStorage 的可視化看板。\n\n- [x] 雙擊便利貼即可快速編輯\n- [ ] 試著按住頂部拖曳移動位置\n- [ ] 點擊右上角釘子置頂重要事項',

                updatedAt: Date.now() - 3600000,

            },
            {
                id: 'note_demo_2',
                title: '專案採購清單 🛒',
                content: '- [x] 人體工學鍵盤\n- [ ] 靜音滑鼠\n- [ ] 27吋雙螢幕支架\n- [ ] 辦公室植栽',
                color: 'green',
                x: 340,
                y: 60,
                zIndex: 5,
                isPinned: false,
                tags: ['採購', '工作'],
                createdAt: Date.now() - 7200000,
                updatedAt: Date.now() - 1800000,

            },
            {
                id: 'note_demo_3',
                title: '週末靈感記筆記 💡',
                content: '閱讀《原子習慣》前三章，嘗試規劃下週的每日時間塊（Time-blocking）。練習 15 分鐘冥想。',
                color: 'pink',
                x: 180,
                y: 320,
                zIndex: 8,
                isPinned: false,
                tags: ['閱讀', '靈感'],
                createdAt: Date.now() - 10000000,
                updatedAt: Date.now() - 10000000,
                rotation: -2.2
            }
        ];

        // Application State
        let notes = [];
        let viewMode = 'canvas'; // 'canvas' or 'grid'
        let boardTheme = 'bg-corkboard';
        let soundEnabled = true;
        let activeColorFilter = 'all';
        let searchQuery = '';
        let sortOption = 'updatedDesc';
        let highestZIndex = 20;

        // Web Audio API Sound Synthesizer (No external audio files needed)
        const playSound = (type) => {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;
                if (type === 'add') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'pin') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.setValueAtTime(1200, now + 0.05);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'delete') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(120, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'drag') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(250, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch(e) { /* Audio context fallback */ }
        };

        // Load data from LocalStorage
        function loadNotes() {
            const stored = localStorage.getItem('sticky_notes_data');
            const storedTheme = localStorage.getItem('sticky_notes_theme');
            const storedView = localStorage.getItem('sticky_notes_view');
            const storedSound = localStorage.getItem('sticky_notes_sound');

            if (storedTheme) boardTheme = storedTheme;
            if (storedView) viewMode = storedView;
            if (storedSound !== null) soundEnabled = storedSound === 'true';

            if (stored) {
                try {
                    notes = JSON.parse(stored);
                } catch(e) {
                    notes = INITIAL_NOTES;
                }
            } else {
                notes = INITIAL_NOTES;
                saveNotes();
            }

            // Find highest zIndex
            notes.forEach(n => {
                if (n.zIndex && n.zIndex > highestZIndex) highestZIndex = n.zIndex;
            });

            applyBoardTheme(boardTheme);
            updateViewButtonsUI();
            updateSoundUI();
        }

        // Save data to LocalStorage
        function saveNotes() {
            localStorage.setItem('sticky_notes_data', JSON.stringify(notes));
            localStorage.setItem('sticky_notes_theme', boardTheme);
            localStorage.setItem('sticky_notes_view', viewMode);
            localStorage.setItem('sticky_notes_sound', soundEnabled);
            renderBoard();
        }

        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'warning' ? 'bg-amber-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
            
            toast.className = `${bgColor} text-white text-xs px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2 transform translate-y-4 opacity-0 transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i>
                <span>${message}</span>
            `;

            toastContainer.appendChild(toast);

            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Custom Confirmation Dialog (Replaces confirm())
        function showConfirm(title, message, onOk) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            
            modal.classList.remove('hidden');

            const okBtn = document.getElementById('confirmOkBtn');
            const cancelBtn = document.getElementById('confirmCancelBtn');

            const handleOk = () => {
                cleanup();
                onOk();
            };

            const cleanup = () => {
                modal.classList.add('hidden');
                okBtn.removeEventListener('click', handleOk);
                cancelBtn.removeEventListener('click', cleanup);
            };

            okBtn.addEventListener('click', handleOk);
            cancelBtn.addEventListener('click', cleanup);
        }

        function getFilteredAndSortedNotes() {
            return notes.filter(note => {
                // Color Filter
                if (activeColorFilter !== 'all' && note.color !== activeColorFilter) return false;
                
                // Search Query Filter
                if (searchQuery.trim() !== '') {
                    const q = searchQuery.toLowerCase();
                    const titleMatch = note.title.toLowerCase().includes(q);
                    const contentMatch = note.content.toLowerCase().includes(q);
                    const tagMatch = note.tags && note.tags.some(t => t.toLowerCase().includes(q));
                    return titleMatch || contentMatch || tagMatch;
                }
                return true;
            }).sort((a, b) => {
                // Pinned notes always first
                if (a.isPinned && !b.isPinned) return -1;
                if (!a.isPinned && b.isPinned) return 1;

                if (sortOption === 'updatedDesc') return b.updatedAt - a.updatedAt;
                if (sortOption === 'createdDesc') return b.createdAt - a.createdAt;
                if (sortOption === 'createdAsc') return a.createdAt - b.createdAt;
                if (sortOption === 'titleAsc') return a.title.localeCompare(b.title, 'zh-TW');
                return 0;
            });
        }

        function formatContentHTML(content, noteId) {
            // Escape HTML for security
            let safeContent = content
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Format markdown checklist (- [ ] or - [x])
            const lines = safeContent.split('\n');
            const formattedLines = lines.map((line, idx) => {
                const uncheckedMatch = line.match(/^(\s*)-\s*\[\s*\]\s*(.*)/);
                const checkedMatch = line.match(/^(\s*)-\s*\[[xX]\]\s*(.*)/);

                if (uncheckedMatch) {
                    return `<div class="flex items-start gap-1.5 my-1">
                        <input type="checkbox" data-note-id="${noteId}" data-line-index="${idx}" class="note-todo-checkbox mt-0.5 rounded border-slate-400 text-amber-500 focus:ring-0 cursor-pointer">
                        <span class="leading-tight">${uncheckedMatch[2]}</span>
                    </div>`;
                } else if (checkedMatch) {
                    return `<div class="flex items-start gap-1.5 my-1 opacity-60 line-through">
                        <input type="checkbox" checked data-note-id="${noteId}" data-line-index="${idx}" class="note-todo-checkbox mt-0.5 rounded border-slate-400 text-amber-500 focus:ring-0 cursor-pointer">
                        <span class="leading-tight">${checkedMatch[2]}</span>
                    </div>`;
                }
                return line;
            });

            return formattedLines.join('<br>');
        }

        function createNoteCardDOM(note) {
            const theme = COLOR_MAP[note.color] || COLOR_MAP.yellow;
            const card = document.createElement('div');

            const isCanvas = viewMode === 'canvas';
            
            card.className = `sticky-note ${theme.bg} ${theme.border} border rounded-xl flex flex-col justify-between overflow-hidden cursor-grab select-none transition-shadow duration-150 ${
                isCanvas ? 'absolute w-72 min-h-[220px]' : 'w-full min-h-[200px]'
            }`;

            if (isCanvas) {
                card.style.left = `${note.x}px`;
                card.style.top = `${note.y}px`;
                card.style.zIndex = note.zIndex || 1;
                card.style.transform = `rotate(${note.rotation || 0}deg)`;
            }

            card.dataset.id = note.id;

            const dateStr = new Date(note.updatedAt).toLocaleDateString('zh-TW', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            const tagsHTML = note.tags && note.tags.length > 0 
                ? note.tags.map(t => `<span class="text-[10px] px-2 py-0.5 rounded-md ${theme.tagBg} font-medium">#${t}</span>`).join(' ')
                : '';

            card.innerHTML = `
                <!-- Note Header -->
                <div class="note-handle p-3 pb-2 ${theme.header} border-b border-black/5 flex items-center justify-between cursor-grab">
                    <div class="flex items-center gap-1.5 overflow-hidden pr-2">
                        ${note.isPinned ? `<i class="fa-solid fa-thumbtack push-pin text-rose-500 text-sm transform -rotate-45" title="已釘選"></i>` : ''}
                        <h3 class="font-bold text-sm ${theme.text} truncate">${note.title || '無標題'}</h3>
                    </div>
                    <div class="flex items-center gap-1">
                        <button class="pin-btn p-1 rounded hover:bg-black/10 ${theme.accent} transition-colors" title="${note.isPinned ? '取消釘選' : '釘選至置頂'}">
                            <i class="fa-solid fa-thumbtack ${note.isPinned ? 'text-rose-500' : 'opacity-40 hover:opacity-100'}"></i>
                        </button>
                        <button class="edit-btn p-1 rounded hover:bg-black/10 ${theme.accent} transition-colors" title="編輯便利貼">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button class="delete-btn p-1 rounded hover:bg-black/10 text-rose-500 hover:text-rose-700 transition-colors" title="刪除便利貼">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>

                <!-- Note Body Content -->
                <div class="p-3 flex-1 overflow-auto text-xs ${theme.text} leading-relaxed break-words font-sans">
                    ${formatContentHTML(note.content, note.id)}
                </div>

                <!-- Note Footer (Tags and Date) -->
                <div class="p-3 pt-2 flex flex-col gap-2 border-t border-black/5 text-[10px] text-black/50">
                    ${tagsHTML ? `<div class="flex flex-wrap gap-1">${tagsHTML}</div>` : ''}
                    <div class="flex items-center justify-between">
                        <span>${dateStr}</span>
                        <button class="copy-btn hover:text-black/80 transition-colors flex items-center gap-1" title="複製內容">
                            <i class="fa-regular fa-copy"></i> 複製
                        </button>
                    </div>
                </div>
            `;

            // Event Listeners for Note Card Actions
            card.querySelector('.pin-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                togglePinNote(note.id);
            });

            card.querySelector('.edit-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                openEditNoteModal(note.id);
            });

            card.querySelector('.delete-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                showConfirm('刪除便利貼', `確定要刪除「${note.title || '這張便利貼'}」嗎？`, () => {
                    deleteNote(note.id);
                });
            });

            card.querySelector('.copy-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                const copyText = `${note.title}\n\n${note.content}`;
                navigator.clipboard.writeText(copyText).then(() => {
                    showToast('便利貼內容已複製到剪貼簿！', 'success');
                }).catch(() => {
                    showToast('複製失敗', 'error');
                });
            });

            // Double click body to edit
            card.addEventListener('dblclick', (e) => {
                if (!e.target.classList.contains('note-todo-checkbox')) {
                    openEditNoteModal(note.id);
                }
            });

            // Todo checkbox toggle inside note body
            card.querySelectorAll('.note-todo-checkbox').forEach(chk => {
                chk.addEventListener('change', (e) => {
                    e.stopPropagation();
                    const lineIdx = parseInt(e.target.dataset.lineIndex);
                    toggleTodoItem(note.id, lineIdx, e.target.checked);
                });
            });

            // Dragging handling in Canvas mode
            if (isCanvas) {
                setupNoteDragging(card, note);
            }

            return card;
        }

        function setupNoteDragging(cardElement, note) {
            const handle = cardElement.querySelector('.note-handle');

            let isDragging = false;
            let startX, startY;
            let initialX, initialY;

            const onPointerDown = (e) => {
                // Ignore if clicked on buttons
                if (e.target.closest('button') || e.target.closest('input')) return;

                isDragging = true;
                playSound('drag');

                // Bring to front
                highestZIndex++;
                note.zIndex = highestZIndex;
                cardElement.style.zIndex = highestZIndex;

                cardElement.classList.add('dragging');

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialX = note.x;
                initialY = note.y;

                document.addEventListener('mousemove', onPointerMove);
                document.addEventListener('mouseup', onPointerUp);
                document.addEventListener('touchmove', onPointerMove, { passive: false });
                document.addEventListener('touchend', onPointerUp);
            };

            const onPointerMove = (e) => {
                if (!isDragging) return;
                if (e.touches) e.preventDefault(); // Prevent screen scroll when dragging note

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                let newX = initialX + deltaX;
                let newY = initialY + deltaY;

                // Keep bounds inside board container
                const boardRect = document.getElementById('boardArea').getBoundingClientRect();
                if (newX < 10) newX = 10;
                if (newY < 10) newY = 10;
                if (newX > boardRect.width - 290) newX = boardRect.width - 290;

                note.x = newX;
                note.y = newY;

                cardElement.style.left = `${newX}px`;
                cardElement.style.top = `${newY}px`;
            };

            const onPointerUp = () => {
                if (!isDragging) return;
                isDragging = false;
                cardElement.classList.remove('dragging');

                document.removeEventListener('mousemove', onPointerMove);
                document.removeEventListener('mouseup', onPointerUp);
                document.removeEventListener('touchmove', onPointerMove);
                document.removeEventListener('touchend', onPointerUp);

                saveNotes();
            };

            handle.addEventListener('mousedown', onPointerDown);
            handle.addEventListener('touchstart', onPointerDown, { passive: false });
        }

        function renderBoard() {
            const canvasContainer = document.getElementById('canvasContainer');
            const gridContainer = document.getElementById('gridContainer');
            const emptyState = document.getElementById('emptyState');
            const noteCountEl = document.getElementById('noteCount');

            const filtered = getFilteredAndSortedNotes();
            noteCountEl.innerText = filtered.length;

            if (notes.length === 0) {
                canvasContainer.innerHTML = '';
                gridContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            if (viewMode === 'canvas') {
                canvasContainer.classList.remove('hidden');
                gridContainer.classList.add('hidden');
                canvasContainer.innerHTML = '';

                filtered.forEach(note => {
                    const card = createNoteCardDOM(note);
                    canvasContainer.appendChild(card);
                });
            } else {
                gridContainer.classList.remove('hidden');
                canvasContainer.classList.add('hidden');
                gridContainer.innerHTML = '';

                filtered.forEach(note => {
                    const card = createNoteCardDOM(note);
                    gridContainer.appendChild(card);
                });
            }
        }

        function togglePinNote(id) {
            const note = notes.find(n => n.id === id);
            if (note) {
                note.isPinned = !note.isPinned;
                note.updatedAt = Date.now();
                playSound('pin');
                saveNotes();
                showToast(note.isPinned ? '已將便利貼釘選至頂部' : '已取消釘選', 'info');
            }
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            playSound('delete');
            saveNotes();
            showToast('已刪除便利貼', 'warning');
        }

        function toggleTodoItem(noteId, lineIndex, isChecked) {
            const note = notes.find(n => n.id === noteId);
            if (!note) return;

            const lines = note.content.split('\n');
            if (lines[lineIndex] !== undefined) {
                if (isChecked) {
                    lines[lineIndex] = lines[lineIndex].replace(/^(\s*)-\s*\[\s*\]/, '$1- [x]');
                } else {
                    lines[lineIndex] = lines[lineIndex].replace(/^(\s*)-\s*\[[xX]\]/, '$1- [ ]');
                }
                note.content = lines.join('\n');
                note.updatedAt = Date.now();
                saveNotes();
            }
        }

        function openAddNoteModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-plus text-amber-500"></i> 新增便利貼';
            document.getElementById('editNoteId').value = '';
            document.getElementById('noteTitleInput').value = '';
            document.getElementById('noteContentInput').value = '';
            document.getElementById('noteTagsInput').value = '';
            document.getElementById('notePinnedInput').checked = false;

            // Default color yellow
            document.querySelector('input[name="noteColor"][value="yellow"]').checked = true;

            showModal();
        }

        function openEditNoteModal(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;

            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-amber-500"></i> 編輯便利貼';
            document.getElementById('editNoteId').value = note.id;
            document.getElementById('noteTitleInput').value = note.title;
            document.getElementById('noteContentInput').value = note.content;
            document.getElementById('noteTagsInput').value = note.tags ? note.tags.join(', ') : '';
            document.getElementById('notePinnedInput').checked = !!note.isPinned;

            const colorRadio = document.querySelector(`input[name="noteColor"][value="${note.color}"]`);
            if (colorRadio) colorRadio.checked = true;

            showModal();
        }

        function showModal() {
            const modal = document.getElementById('noteModal');
            const modalBox = document.getElementById('modalBox');
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                modalBox.classList.remove('scale-95');
            });
        }

        function closeModal() {
            const modal = document.getElementById('noteModal');
            const modalBox = document.getElementById('modalBox');
            modal.classList.add('opacity-0');
            modalBox.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // Handle Form Submit
        document.getElementById('noteForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const editId = document.getElementById('editNoteId').value;
            const title = document.getElementById('noteTitleInput').value.trim();
            const content = document.getElementById('noteContentInput').value.trim();
            const rawTags = document.getElementById('noteTagsInput').value.trim();
            const isPinned = document.getElementById('notePinnedInput').checked;
            const selectedColor = document.querySelector('input[name="noteColor"]:checked').value;

            const tags = rawTags ? rawTags.split(/[,，\s]+/).filter(t => t.length > 0) : [];

            if (editId) {
                // Edit existing note
                const note = notes.find(n => n.id === editId);
                if (note) {
                    note.title = title;
                    note.content = content;
                    note.tags = tags;
                    note.color = selectedColor;
                    note.isPinned = isPinned;
                    note.updatedAt = Date.now();
                }
                showToast('已更新便利貼！', 'success');
            } else {
                // Calculate random position for new note in canvas
                const boardWidth = document.getElementById('boardArea').clientWidth || 800;
                const randomX = Math.max(20, Math.floor(Math.random() * (boardWidth - 320)));
                const randomY = Math.max(20, Math.floor(Math.random() * 250) + 20);

                highestZIndex++;
                const newNote = {
                    id: 'note_' + Date.now(),
                    title: title || '新筆記',
                    content: content,
                    color: selectedColor,
                    x: randomX,
                    y: randomY,
                    zIndex: highestZIndex,
                    isPinned: isPinned,
                    tags: tags,
                    createdAt: Date.now(),
                    updatedAt: Date.now(),
                    rotation: (Math.random() * 5 - 2.5).toFixed(1) // -2.5deg to +2.5deg
                };

                notes.unshift(newNote);
                playSound('add');
                showToast('新增便利貼成功！', 'success');
            }

            saveNotes();
            closeModal();
        });

        function applyBoardTheme(themeClass) {
            boardTheme = themeClass;
            const body = document.getElementById('appBody');
            body.className = `${themeClass} min-h-screen text-slate-800 flex flex-col transition-colors duration-300`;
        }

        function updateViewButtonsUI() {
            const canvasBtn = document.getElementById('canvasViewBtn');
            const gridBtn = document.getElementById('gridViewBtn');

            if (viewMode === 'canvas') {
                canvasBtn.className = "px-2.5 py-1 rounded-md font-medium text-slate-800 bg-white shadow-sm transition-all";
                gridBtn.className = "px-2.5 py-1 rounded-md font-medium text-slate-500 hover:text-slate-700 transition-all";
            } else {
                gridBtn.className = "px-2.5 py-1 rounded-md font-medium text-slate-800 bg-white shadow-sm transition-all";
                canvasBtn.className = "px-2.5 py-1 rounded-md font-medium text-slate-500 hover:text-slate-700 transition-all";
            }
        }

        function updateSoundUI() {
            const soundStatus = document.getElementById('soundStatus');
            soundStatus.innerText = soundEnabled ? '開啟' : '關閉';
            soundStatus.className = soundEnabled ? 'text-emerald-600 font-semibold' : 'text-slate-400';
        }

        function exportBackupJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `sticky_notes_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('備份 JSON 檔案已下載！', 'success');
        }

        function importBackupJSON(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedNotes = JSON.parse(e.target.result);
                    if (Array.isArray(importedNotes)) {
                        notes = importedNotes;
                        saveNotes();
                        showToast(`成功匯入 ${importedNotes.length} 張便利貼！`, 'success');
                    } else {
                        showToast('格式不符：檔案內容應為便利貼陣列', 'error');
                    }
                } catch(err) {
                    showToast('匯入失敗，請確認檔案為正確 JSON 格式', 'error');
                }
            };
            reader.readAsText(file);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadNotes();

            // Modal Trigger Buttons
            document.getElementById('addNoteBtn').addEventListener('click', openAddNoteModal);
            document.getElementById('emptyAddBtn').addEventListener('click', openAddNoteModal);
            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

            // View Switcher
            document.getElementById('canvasViewBtn').addEventListener('click', () => {
                viewMode = 'canvas';
                updateViewButtonsUI();
                saveNotes();
            });

            document.getElementById('gridViewBtn').addEventListener('click', () => {
                viewMode = 'grid';
                updateViewButtonsUI();
                saveNotes();
            });

            // Theme Dropdown Toggle
            const themeMenuBtn = document.getElementById('themeMenuBtn');
            const themeDropdown = document.getElementById('themeDropdown');
            themeMenuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                themeDropdown.classList.toggle('hidden');
                moreDropdown.classList.add('hidden');
            });

            themeDropdown.querySelectorAll('button[data-theme]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const selectedTheme = btn.dataset.theme;
                    applyBoardTheme(selectedTheme);
                    saveNotes();
                    themeDropdown.classList.add('hidden');
                });
            });

            // More Options Dropdown Toggle
            const moreMenuBtn = document.getElementById('moreMenuBtn');
            const moreDropdown = document.getElementById('moreDropdown');
            moreMenuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                moreDropdown.classList.toggle('hidden');
                themeDropdown.classList.add('hidden');
            });

            // Close dropdowns when clicking outside
            document.addEventListener('click', () => {
                themeDropdown.classList.add('hidden');
                moreDropdown.classList.add('hidden');
            });

            // Color Filter Buttons
            document.querySelectorAll('.color-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.color-filter-btn').forEach(b => b.classList.remove('ring-2', 'ring-slate-400', 'scale-110'));
                    btn.classList.add('ring-2', 'ring-slate-400', 'scale-110');
                    activeColorFilter = btn.dataset.colorFilter;
                    renderBoard();
                });
            });

            // Search Filter Input
            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearchBtn');

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                if (searchQuery.trim().length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
                renderBoard();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearSearchBtn.classList.add('hidden');
                renderBoard();
            });

            // Sort Select Option
            document.getElementById('sortSelect').addEventListener('change', (e) => {
                sortOption = e.target.value;
                renderBoard();
            });

            // Sound Toggle
            document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                soundEnabled = !soundEnabled;
                updateSoundUI();
                saveNotes();
                showToast(soundEnabled ? '音效已開啟' : '音效已關閉', 'info');
            });

            // Export & Import Handlers
            document.getElementById('exportBtn').addEventListener('click', exportBackupJSON);
            
            const importBtn = document.getElementById('importBtn');
            const importFileInput = document.getElementById('importFileInput');

            importBtn.addEventListener('click', () => importFileInput.click());
            importFileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    importBackupJSON(e.target.files[0]);
                }
            });

            // Clear All Notes Handler
            document.getElementById('clearAllBtn').addEventListener('click', () => {
                showConfirm('清空看板', '確定要清空所有便利貼嗎？此動作無法復原！', () => {
                    notes = [];
                    saveNotes();
                    showToast('已清空所有便利貼', 'warning');
                });
            });
        });
    </script>
</body>
</html>
